# Common output directory
common_output_directory: ".missionwares/AiAssist/generated"

# Automatically clear the output directory before capturing new context.
auto_clear_output_on_capture: true

# ---------------------------------------------------------------
# COMMON IGNORE PATTERNS
# Single source of truth for all generators — tree, paths, and zip.
# The app adapts these for each tool's syntax automatically:
#   tree  →  joined as pipe-delimited string for tree -I
#   zip   →  converted to recursive glob patterns for zip -x
#
# Adding or removing an entry here applies to ALL generators.
# ---------------------------------------------------------------
common_ignore_patterns:

  # == BASE EXCLUSIONS ==========================================
  # Standard exclusions applied to every project — do not remove.

  # App internals
  - ".missionwares"                # MissionWares internal files
  - ".ai_assist"                   # AI Assist internal files
  - "Resources/Universal/training" # Training resources
  - "training_disabled"            # Disabled training resources

  # Source control
  - ".git"                         # Git repository directory
  - "*.gitignore"                  # Git ignore files

  # Private / sensitive content
  - ".private"                    # Directory for private files

  # Build artifacts
  - "build"                       # Build output directory
  - "DerivedData"                 # Xcode build cache
  - "target"                      # Rust/Java build output
  - ".pio"                        # PlatformIO build output

  # Dependencies
  - "node_modules"                # Node.js dependencies
  - "extensions"                  # VS Code extensions
  - ".pio"                        # PlatformIO dependencies

  # Documentation
  - "_archive"                    # Directory of historical documents
  - "_handoff"                    # Directory of Hand-off documents - from previous chats
  - "_marketing"                  # Directory of Marketing assets
  - "_reference"                  # Directory of Reference materials

  # Generated output (prevents including our own output)
  - "generated"                   # Directory for all AI Assist generated files — prevents recursion
  - "output"                      # Directory for generated outputs — Legacy Version

  # IDE and tooling
  - ".vscode"                     # VS Code settings and extensions
  - ".allure"                     # Allure test reports and results
  - "allure-report"               # Allure report output
  - "allure-results"              # Allure results output    
  - "SampleData"                  # Sample data

  # System files
  - ".DS_Store"                   # macOS system file
  - ".sftpignore"                 # SFTP configuration file

  # Image files
  - "*.gif"
  - "*.jpg"
  - "*.jpeg"
  - "*.png"
  - "*.svg"
  - "*.afdesign"

  # Binary / media
  - "*.ttf"
  - "*.wav"
  - "*.zip"
  - "*.mmdb"

  # Xcode specific
  - "Assets.xcassets"             # Asset catalog — directory name, not extension
  - "*.entitlements"              # iOS/macOS app entitlements

  # == PROJECT EXCLUSIONS =======================================
  # Exclusions specific to this project — add/remove as needed.

# ---------------------------------------------------------------
# AI Directive — your portable "secret sauce" document
# ---------------------------------------------------------------
# directory: path to your .md directive files (local, thumb drive, anywhere)
# output_filename: how the consolidated file is named in ai_deliverable/
ai_directive:
  directory: ~/GoogleDrive/Documents/Development/Methodology/Project-mAi-Methodology/ai_directive/
  output_filename: mAi_Core_Methodology.md

# ---------------------------------------------------------------
# Configuration for project documentation management
# ---------------------------------------------------------------
documentation:
  base_directory: "_docs"
  auto_generate_missing: true
  required_files:
    - "README.md"
    - "REQUIREMENTS.md"
    - "ARCHITECTURE.md"
    - "FEATURES.md"
    - "ISSUES.md"
    - "CHANGELOG.md"
    - "API.md"
    - "SETUP.md"
  assets_directory: "assets"
  versioning:
    enabled: true
    track_changes: true
    backup_on_major_updates: false

# Configuration for generate_tree
# Ignore patterns are now read from common_ignore_patterns above.
generate_tree:
  output_file: "tree.md"
  output_locations:
    - path: "${common_output_directory}/support/tree"
      save_timestamped_version: false

# Configuration for generate_paths
# Ignore patterns are now read from common_ignore_patterns above.
generate_paths:
  output_file: "paths.md"
  exclude_directories: true
  output_locations:
    - path: "${common_output_directory}/support/paths"
      save_timestamped_version: false

# Configuration for todo file consolidation
generate_todos:
  output_file: "Todo_Doing_Done.md"
  output_locations:
    - path: "${common_output_directory}/support/todo"
      save_timestamped_version: false

# Configuration for generate_context
generate_context:
  output_file: "context.txt"
  maximum_line_length: 25000
  output_locations:
    - path: "${common_output_directory}/support/context"
      save_timestamped_version: false

# Configuration for consolidated
generate_consolidated:
  output_locations:
    - path: "${common_output_directory}/support/consolidated"
      save_timestamped_version: false

# ---------------------------------------------------------------
# Code Zip Export
# Ignore patterns are now read from common_ignore_patterns above.
# ---------------------------------------------------------------
generate_code_zip:
  zip_prefix: "project_code"
  output_locations:
    - path: "${common_output_directory}/ai_deliverable"
      save_timestamped_version: false
